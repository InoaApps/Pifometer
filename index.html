<style>
:root{
  --bg:#FFF4E4; --ink:#1C1433; --mut:#6B6380; --card:#fff; --line:#EADFCC;
  --g1:#FF6B3D; --g1s:#FFE1D6;   /* Ballpark */
  --g2:#7B5CFF; --g2s:#E6E0FF;   /* Right Angle */
  --g3:#0FB67F; --g3s:#D3F5E8;   /* What Year */
  --gold:#FFC83D;
  --c:var(--g1); --cs:var(--g1s);
  --disp:"Bricolage Grotesque",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
body.hasbub{padding-top:calc(64px + env(safe-area-inset-top))}
body.hasbub main{min-height:calc(100dvh - 64px - env(safe-area-inset-top))}
#ibub{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:4;width:calc(100% - 24px);max-width:416px}
#ibub button{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border-radius:99px;min-height:48px;font-size:15px;box-shadow:0 6px 0 rgba(0,0,0,.25),0 8px 24px rgba(28,20,51,.35)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;min-height:100dvh;padding:0 16px env(safe-area-inset-bottom);transition:background .4s}
body.g{background:var(--c)}
main{max-width:440px;margin:0 auto;padding:20px 0 40px;min-height:100dvh;display:flex;flex-direction:column}
h1,h2,.disp{font-family:var(--disp);letter-spacing:-.02em}
h1{font-size:44px;line-height:.98;margin:.15em 0 .3em;font-weight:800}
h2{font-size:26px;line-height:1.12;margin:0 0 .4em;font-weight:800}
p{margin:0 0 1em}
.mut{color:var(--mut)}
.logo{font-family:var(--disp);font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--g1) 0 33%,var(--g2) 0 66%,var(--g3) 0);display:inline-block}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:20px;box-shadow:0 5px 0 var(--ink)}
.tile{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:2px solid var(--ink);margin-top:10px;background:var(--cs);box-shadow:0 4px 0 var(--ink)}
.tile .ic{width:48px;height:48px;border-radius:14px;background:var(--c);display:grid;place-items:center;font-size:24px;flex:none;border:2px solid var(--ink)}
.tile b{font-family:var(--disp);font-size:19px;display:block;line-height:1.1}
.tile span{font-size:14px;color:var(--mut)}
button{font:inherit;font-weight:700;font-size:17px;border:2px solid var(--ink);border-radius:16px;padding:15px 18px;background:var(--ink);color:#fff;width:100%;cursor:pointer;min-height:54px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button.alt{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.push{margin-top:auto}
.sp{height:12px}
/* game */
.hud{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;margin-bottom:14px}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.q{font-family:var(--disp);font-weight:800;font-size:27px;line-height:1.12;margin:0 0 6px}
.val{font-family:var(--disp);font-weight:800;font-size:52px;text-align:center;line-height:1;margin:18px 0 30px;color:var(--c);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:8px 0}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:9px;background:var(--cs);border:2px solid var(--ink)}
input[type=range]::-moz-range-track{height:14px;border-radius:9px;background:var(--cs);border:2px solid var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--ink);margin-top:-12px;box-shadow:0 3px 0 var(--ink)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--ink)}
.keys{display:grid;gap:8px;margin-top:8px}.k3{grid-template-columns:repeat(3,1fr)}.k4{grid-template-columns:repeat(4,1fr)}.k5{grid-template-columns:repeat(5,1fr)}
.key{min-height:48px;padding:8px 4px;font-size:16px;background:var(--cs);color:var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:12px}
.key:hover{background:var(--c);color:#fff}
.step-l{font-weight:700;font-size:14px;margin:16px 0 0;display:flex;justify-content:space-between}.step-l a{color:var(--mut)}
.slrow{display:flex;align-items:center;gap:8px}
.sl{position:relative;flex:1}
.exact{background:none;border:0;box-shadow:none;color:var(--mut);text-decoration:underline;font-size:14px;min-height:36px;width:auto;padding:4px 8px;margin:0 auto;display:block}
.xin{width:100%;font:inherit;font-size:20px;text-align:center;padding:10px;border-radius:12px;border:2px solid var(--ink);margin-top:6px}
#mk{position:absolute;inset:0;pointer-events:none}
.ansm{position:absolute;top:-22px;transform:translateX(-50%);text-align:center;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;animation:pop .45s cubic-bezier(.2,.9,.3,1.5) both}
.ansm i{display:block;width:6px;height:40px;margin:2px auto 0;border-radius:3px;background:var(--ink)}
.gapb{position:absolute;top:17px;height:14px;background:var(--c);opacity:.45;border-radius:9px}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-weight:500}
/* reveal scale */
.scale{position:relative;height:76px;margin:14px 6px 4px}
.scale .tr{position:absolute;left:0;right:0;top:26px;height:6px;border-radius:9px;background:var(--line)}
.scale .gap{position:absolute;top:26px;height:6px;background:var(--c);opacity:.35;border-radius:9px}
.mk{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:12px;font-weight:700;white-space:nowrap}
.mk{line-height:18px}.mk i{display:block;width:16px;height:16px;border-radius:50%;margin:4px auto 0;border:3px solid var(--ink)}
.mk.you i{background:#fff}
.mk.ans i{background:var(--c)}
.mk.ans{top:0;z-index:1} .mk.you{top:22px;color:var(--mut)} .mk.you i{margin:0 auto 4px}
.mk.ans{animation:slide .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes slide{from{left:var(--from)}}
.fb{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--cs)}
.pts{font-family:var(--disp);font-weight:800;font-size:30px;color:var(--c);animation:pop .45s cubic-bezier(.2,.9,.3,1.5) both;min-width:64px}
.fb p{margin:0;font-size:15px;line-height:1.4}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.verdict{font-family:var(--disp);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
/* intro */
.intro{color:#fff;text-align:center;margin:auto 0;padding:20px 0}
.intro .ic{font-size:72px;line-height:1;display:block;margin-bottom:10px;animation:pop .5s cubic-bezier(.2,.9,.3,1.5) both}
.intro h1{font-size:52px}
.intro p{font-size:18px;opacity:.95;max-width:30ch;margin:0 auto 1em}
.intro .step{font-weight:700;opacity:.85;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
/* result */
.score{font-family:var(--disp);font-weight:800;font-size:88px;line-height:.9;letter-spacing:-.04em}
.grid{font-size:24px;letter-spacing:4px;line-height:1.3}
.bars{display:grid;gap:10px;margin:6px 0 4px}
.bars div{display:grid;grid-template-columns:112px 1fr 40px;align-items:center;gap:10px;font-size:14px;font-weight:700}
.bars em{height:14px;border-radius:9px;background:var(--line);overflow:hidden;border:2px solid var(--ink)}
.bars em b{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.9,.3,1)}
input[type=email]{width:100%;font:inherit;padding:14px;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink);margin-bottom:10px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.confetti{display:none}}
.chal{background:var(--g2s);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;margin:14px 0 0;font-weight:700}
.inst{margin-top:12px}.inst button{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.sheet{position:fixed;inset:0;background:rgba(28,20,51,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:var(--card);border:2px solid var(--ink);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-width:440px;width:100%}
.sheet ol{padding-left:1.2em;margin:0 0 14px}.sheet li{margin-bottom:8px}
</style>

 {q:"The Hindenburg airship disaster",a:1937},
 {q:"Princess Diana dies",a:1997},
 {q:"The Beatles play on The Ed Sullivan Show",a:1964},
 {q:"Michael Jackson releases Thriller",a:1982},
 {q:"The first PlayStation is released in Japan",a:1994},
 {q:"Notre-Dame de Paris catches fire",a:2019},
 {q:"The first website goes online",a:1991}
];

// ---------- State ----------
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const app=document.getElementById("app");
const PLAYER=(()=>{let id=store.get("pid",null);if(!id){id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));store.set("pid",id)}return id})();
const sets={ballpark:pick(BALL,ROUNDS),year:pick(YEARS,ROUNDS),eye:Array.from({length:ROUNDS},()=>Math.round(12+R()*156))};
let gi=0,ri=0,pts=[[],[],[]],answered=false,cur=null;
const total=()=>pts.flat().reduce((a,b)=>a+b,0);

function theme(g){const s=document.documentElement.style;
  if(g){s.setProperty("--c",`var(${g.c})`);s.setProperty("--cs",`var(${g.cs})`);document.body.classList.add("g")}
  else{s.setProperty("--c","var(--g1)");s.setProperty("--cs","var(--g1s)");document.body.classList.remove("g")}}

// ---------- Home ----------
function home(){
  theme(null);
  const st=store.get("streak",{n:0,last:""});
  const done=store.get("done",null);const played=!CH&&done&&done.date===today;
  app.innerHTML=`<div class="row"><span class="logo"><i></i>${NAME}</span><span class="pill">🔥 ${st.n}</span></div>
  <div style="margin:28px 0 8px"><h1>How good is your gut?</h1>
  <p class="mut" style="font-size:18px">3 quick games, 3 minutes a day. Same questions for everyone, so you can compare with friends.</p></div>
  ${CH?`<div class="chal">🥊 A friend scored <b>${CH.score}</b>/1500. Beat them on the same questions!</div>`:""}
  ${GAMES.map((g,i)=>`<div class="tile" style="--c:var(${g.c});--cs:var(${g.cs})"><div class="ic">${g.ic}</div><div><b>${g.title}</b><span>${g.rule}</span></div></div>`).join("")}
  <div class="push" style="padding-top:22px">${played
    ?`<button id="res">See today's result · ${done.total}</button><div class="sp"></div><button id="go" class="alt">Play again for fun</button>`
    :`<button id="go">${CH?"Take the challenge":"Play today's round"}</button>`}</div>`;
  initInstall();
  go("go",()=>{gi=0;ri=0;pts=[[],[],[]];intro()});
  go("res",()=>result(done.pts,true));
}
function go(id,fn){const e=document.getElementById(id);if(e)e.onclick=fn}

// ---------- Game intro ----------
function intro(){
  const g=GAMES[gi];theme(g);
  app.innerHTML=`<div class="intro"><span class="step">Game ${gi+1} of 3</span><span class="ic">${g.ic}</span><h1>${g.title}</h1><p>${g.rule}</p></div>
  <button id="start" class="alt">Let's go</button>`;
  go("start",play);
}

// ---------- Round ----------
function play(){
  const g=GAMES[gi];answered=false;let guess=null;
  if(g.id==="ballpark")cur=sets.ballpark[ri];
  if(g.id==="eye")cur=sets.eye[ri];
  if(g.id==="year")cur=sets.year[ri];
  let body="";
  if(g.id==="ballpark")body=`<p class="q">${cur.q}</p><div class="val" id="v"></div>
    <div class="slrow"><div class="sl"><input id="s" type="range" min="0" max="1000" value="500" aria-label="Your estimate"><div id="mk"></div></div></div>
    <div class="ends"><span>${fmt(cur.min)}</span><span>${fmt(cur.max)}</span></div>`;
  if(g.id==="year")body=`<p class="q">${cur.q}</p><p class="mut" style="margin:0">In which year?</p><div class="val" id="v"></div>
    <div class="slrow"><div class="sl"><input id="s" type="range" min="1890" max="2025" value="1957" aria-label="Your estimate (year)"><div id="mk"></div></div></div>
    <div class="ends"><span>1890</span><span>2025</span></div>`;
  if(g.id==="eye")body=`<p class="q">Make a <span style="color:var(--c)">${cur}°</span> angle</p><p class="mut" style="margin:0">Tap where the line should point. Tap again to adjust.</p><div id="pad">${drawSvg(null,null)}</div>`;
  app.innerHTML=`<div class="hud"><span>${g.ic} ${g.short}</span><div class="dots">${Array.from({length:ROUNDS},(_,i)=>`<i class="${i<=ri?"on":""}"></i>`).join("")}</div><span>${total()}</span></div>
  <div class="card">${body}<div id="fb"></div></div>
  <div class="push" style="padding-top:18px"><button id="ok">Lock it in</button></div>`;
  const ok=document.getElementById("ok");
  let s,lmin,lmax,read;
  if(g.id!=="eye"){
    s=document.getElementById("s");const v=document.getElementById("v");
    lmin=Math.log(cur.min||1);lmax=Math.log(cur.max||1);
    let typed=null;read=()=>typed!=null?typed:g.id==="ballpark"?Math.exp(lmin+(s.value/1000)*(lmax-lmin)):+s.value;
    const show=()=>v.textContent=g.id==="ballpark"?"≈ "+fmt(read()):s.value;
    s.oninput=()=>{typed=null;show()};show();
    // exact value
    const ex=document.createElement("button");ex.className="exact";ex.textContent="Type exact value";
    document.querySelector(".ends").after(ex);
    ex.onclick=()=>{if(answered)return;const inp=document.createElement("input");inp.className="xin";inp.type="text";inp.inputMode="numeric";inp.placeholder=g.id==="year"?"e.g. 1969":"Type a number, e.g. 5800";
      ex.replaceWith(inp);inp.focus();
      inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,"");if(!inp.value)return;let n=parseInt(inp.value,10);
        if(g.id==="ballpark"){n=Math.min(cur.max,Math.max(cur.min,n));s.value=Math.round((Math.log(n)-lmin)/(lmax-lmin)*1000)}else{s.value=Math.min(2025,Math.max(1890,n))}
        typed=g.id==="ballpark"?n:null;show()}};
  } else {
    const pad=document.getElementById("pad");
    pad.addEventListener("pointerdown",e=>{
      if(answered)return;const svg=pad.querySelector("svg"),r=svg.getBoundingClientRect();
      const x=(e.clientX-r.left)*280/r.width-140,y=200-(e.clientY-r.top)*210/r.height;
      guess=Math.min(179,Math.max(1,Math.round(Math.atan2(Math.max(y,0),x)*180/Math.PI)));
      pad.innerHTML=drawSvg(guess,null);ok.textContent="Lock it in";
    });
  }
  ok.onclick=()=>{
    if(answered){next();return}
    if(g.id==="eye"&&guess==null){ok.textContent="Tap the drawing first";return}
    answered=true;let p,msg;
    if(g.id==="ballpark"){guess=read();const e=Math.abs(Math.log10(guess/cur.a));p=Math.max(0,Math.round(100*(1-e/2)));
      marker((Math.log(cur.a)-lmin)/(lmax-lmin),fmt(cur.a));msg=`It's <b>${fmt(cur.a)}</b>. ${cur.note}`}
    if(g.id==="year"){guess=+s.value;const e=Math.abs(guess-cur.a);p=Math.max(0,Math.round(100-e*3));
      marker((cur.a-1890)/135,cur.a);msg=e===0?`<b>${cur.a}</b>. Spot on!`:`It was <b>${cur.a}</b>. You were ${e} year${e===1?"":"s"} off.`}
    if(g.id==="eye"){const e=Math.abs(guess-cur);p=Math.max(0,Math.round(100-e*4));
      document.getElementById("pad").innerHTML=drawSvg(guess,cur);msg=e===0?`Exactly ${cur}°. Spot on!`:`You made <b>${guess}°</b>, ${e}° off.`}
    if(s)s.disabled=true;
    pts[gi].push(p);
    document.getElementById("fb").innerHTML=`<div class="fb"><span class="pts">+${p}</span><div><span class="verdict">${verdict(p)}</span><p>${msg}</p></div></div>`;
    const last=gi===GAMES.length-1&&ri===ROUNDS-1;
    ok.textContent=last?"See my result":ri===ROUNDS-1?"Next game":"Next";
    if(p>=90)confetti(18);
  };
  function marker(f,label){
    f=Math.min(1,Math.max(0,f));const gf=(s.value-s.min)/(s.max-s.min);
    const pos=x=>`calc(${x*100}% + ${17-34*x}px)`;
    document.getElementById("mk").innerHTML=`<div class="gapb" style="left:${pos(Math.min(f,gf))};width:calc(${Math.abs(f-gf)*100}% - ${Math.abs(f-gf)*34}px)"></div><div class="ansm" style="left:${pos(f)}"><span>${label}</span><i></i></div>`;
  }
  function next(){ri++;if(ri>=ROUNDS){ri=0;gi++;gi>=GAMES.length?finish():intro()}else play()}
}
function drawSvg(you,ans){
  const ox=140,oy=200,L=125,pt=d=>{const r=d*Math.PI/180;return [(ox+L*Math.cos(r)).toFixed(1),(oy-L*Math.sin(r)).toFixed(1)]};
  const line=(d,st)=>{const[x,y]=pt(d);return `<path d="M${ox} ${oy} L${x} ${y}" ${st} stroke-linecap="round" fill="none"/>`};
  return `<svg viewBox="0 0 280 210" width="100%" style="touch-action:none;cursor:crosshair;margin-top:8px" role="img" aria-label="Drawing area">
   <path d="M15 ${oy} A${L} ${L} 0 0 1 265 ${oy}" fill="var(--cs)" stroke="none"/>
   ${ans!=null?line(ans,'stroke="var(--c)" stroke-width="5" stroke-dasharray="8 7"'):""}
   ${you!=null?line(you,'stroke="var(--ink)" stroke-width="6"'):`<text x="140" y="120" text-anchor="middle" font-size="14" fill="var(--mut)" font-weight="700">tap where the line should point</text>`}
   <path d="M${ox} ${oy} L${ox+L} ${oy}" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
   <circle cx="${ox}" cy="${oy}" r="7" fill="var(--ink)"/>
   ${ans!=null?`<text x="${pt(ans)[0]}" y="${+pt(ans)[1]-10}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--c)">${ans}°</text>`:""}</svg>`}
function verdict(p){return p>=90?"Bullseye 🎯":p>=70?"Sharp 👀":p>=40?"Close-ish 🤏":"Way off 🙈"}
function scale(you,ans,label,ylab){
  const c=x=>Math.min(100,Math.max(0,x*100));const a=c(ans),y=c(you);
  return `<div class="scale"><div class="tr"></div><div class="gap" style="left:${Math.min(a,y)}%;width:${Math.abs(a-y)}%"></div>
  <div class="mk you" style="left:${y}%"><i></i>${ylab||"You"}</div><div class="mk ans" style="left:${a}%;--from:${y}%">${label}<i></i></div></div>`}
function angleSvg(a,guess){
  const L=120,ox=50,oy=160,pt=d=>{const r=d*Math.PI/180;return [ox+L*Math.cos(r),oy-L*Math.sin(r)].map(n=>n.toFixed(1)).join(" ")};
  const arc=d=>{const r=d*Math.PI/180,R=34;return `M${ox+R} ${oy} A${R} ${R} 0 0 0 ${(ox+R*Math.cos(r)).toFixed(1)} ${(oy-R*Math.sin(r)).toFixed(1)}`};
  return `<svg width="100%" height="190" viewBox="0 0 280 190" role="img" aria-label="An angle to estimate">
   <path d="${arc(a)}" fill="none" stroke="var(--c)" stroke-width="6" stroke-linecap="round"/>
   ${guess!=null?`<path d="M${ox} ${oy} L${pt(guess)}" stroke="var(--c)" stroke-width="4" stroke-dasharray="7 7" stroke-linecap="round" fill="none"/><text x="${pt(guess).split(" ")[0]}" y="${+pt(guess).split(" ")[1]-8}" font-size="13" font-weight="700" fill="var(--c)" text-anchor="middle">you</text>`:""}
   <path d="M${ox+L} ${oy} L${ox} ${oy} L${pt(a)}" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
   <circle cx="${ox}" cy="${oy}" r="6" fill="var(--ink)"/></svg>`}

// ---------- Result ----------
function finish(){
  const t=total();const st=store.get("streak",{n:0,last:""});
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(st.last!==today){st.n=st.last===y?st.n+1:1;st.last=today;store.set("streak",st)}
  if(!CH)store.set("done",{date:today,total:t,pts});
  send("plays",{score:t,details:{date:seedDay,challenge:!!CH,ballpark:pts[0],angle:pts[1],year:pts[2]}});
  result(pts,false);
}
function rank(t){return t>=1300?["Hawk","🦅"]:t>=1050?["Sharp","🎯"]:t>=750?["Steady","🧭"]:["Warming up","🌱"]}
const sq=p=>p>=80?"🟩":p>=50?"🟨":p>=20?"🟧":"⬛";
function result(P,again){
  theme(null);
  const t=P.flat().reduce((a,b)=>a+b,0),[rk,re]=rank(t),st=store.get("streak",{n:0});
  const grid=GAMES.map((g,i)=>`${g.ic} ${P[i].map(sq).join("")}`).join("\n");
  const share=`${NAME} · ${today}\n${re} ${rk} · ${t}/1500\n${grid}\n🔥 ${st.n}-day streak`;
  const joined=store.get("joined",false);
  app.innerHTML=`<div class="row"><span class="logo"><i></i>${NAME}</span><span class="pill">🔥 ${st.n}</span></div>
  <div style="text-align:center;margin:26px 0 18px"><div style="font-size:56px">${re}</div>
  <div class="score disp" id="sc">0</div><div class="mut" style="font-weight:700">out of 1500 · ${rk}</div></div>
  <div class="card"><div class="bars">${GAMES.map((g,i)=>{const s=P[i].reduce((a,b)=>a+b,0);return `<div><span>${g.ic} ${g.short}</span><em><b style="background:var(${g.c})" data-w="${s/5}"></b></em><span>${s}</span></div>`}).join("")}</div>
  <div class="grid" style="margin:14px 0 14px;text-align:center">${GAMES.map((g,i)=>P[i].map(sq).join("")).join("<br>")}</div>
  ${CH?`<div class="chal" style="margin:0 0 12px;text-align:center">${t>CH.score?"🏆 You beat your friend":t===CH.score?"🤝 It's a tie":"😅 Your friend wins"}: <b>${t}</b> vs <b>${CH.score}</b></div>`:""}
  <button id="ch">Challenge a friend</button><div class="sp"></div><button id="cp" class="alt">Share my score</button></div>
  
  <div class="card" style="margin-top:18px;background:var(--g2s)"><h2>Want the full app?</h2>
  <p>5 games including <b>Real or AI?</b> and <b>Guess the Accent</b>, streaks, leaderboards with friends and your weekly Pifometer profile.</p>
  ${joined?`<p style="margin:0"><b>You're on the list ✔</b> We'll email you first.</p>`:`<form id="wl"><input type="email" required placeholder="you@email.com" aria-label="Email" autocomplete="email"><button>Get early access</button></form>`}</div>
  <div class="sp"></div><button class="alt" id="back">Back home</button>`;
  // animate
  const el=document.getElementById("sc"),t0=performance.now(),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const tick=n=>{const k=rm?1:Math.min(1,(n-t0)/900);el.textContent=Math.round(t*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick)};requestAnimationFrame(tick);
  requestAnimationFrame(()=>document.querySelectorAll(".bars b").forEach(b=>b.style.width=b.dataset.w+"%"));
  if(!again&&t>=1050)confetti(40);
  go("cp",async e=>{try{if(navigator.share)await navigator.share({text:share});else{await navigator.clipboard.writeText(share);e.target.textContent="Copied ✔ Paste it anywhere"}}catch{}track("share")});
  go("ch",async e=>{const url=location.origin+location.pathname+"?c="+seedDay+"&s="+t;const msg=`I got ${t}/1500 on ${NAME}. Beat me on the same questions 👇`;
    try{if(navigator.share)await navigator.share({text:msg,url});else{await navigator.clipboard.writeText(msg+" "+url);e.target.textContent="Link copied ✔ Send it to a friend"}}catch{}track("challenge")});
  go("back",home);initInstall();
  const f=document.getElementById("wl");
  if(f)f.onsubmit=async e=>{e.preventDefault();const em=f.querySelector("input").value;
    const list=store.get("waitlist",[]);list.push({email:em,at:Date.now(),score:t});store.set("waitlist",list);
    send("waitlist",{email:em,score:t});
    store.set("joined",true);track("waitlist");result(P,true)};
}
// ---------- Install to home screen ----------
let deferredInstall=null;
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
addEventListener("appinstalled",()=>{store.set("installed",true);showBubble()});
addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
function showBubble(){
  if(isStandalone()||store.get("installed",false)){document.getElementById("ibub")?.remove();document.body.classList.remove("hasbub");return}
  if(document.getElementById("ibub"))return;
  const d=document.createElement("div");d.id="ibub";d.innerHTML='<button class="instbtn">📲 Add Pifometer to your home screen</button>';
  document.body.appendChild(d);document.body.classList.add("hasbub");
}
function initInstall(){
  showBubble();
  document.querySelectorAll(".instbtn").forEach(b=>b.onclick=async()=>{
    if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice.catch(()=>{});deferredInstall=null;return}
    const inApp=/Instagram|FBAN|FBAV|TikTok|musical_ly|Line\//i.test(navigator.userAgent);
    const s=document.createElement("div");s.className="sheet";
    s.innerHTML=`<div><h2>Add Pifometer to your home screen</h2>${inApp?`<p><b>First, open this page in ${isIOS()?"Safari":"Chrome"}.</b> Tap the ⋯ or share icon in the corner and choose <b>Open in browser</b>. Installing isn't possible inside Instagram or TikTok.</p>`:`<ol>${isIOS()
      ?(navigator.share?"<li>Tap <b>Open share menu</b> below (or the Share button at the bottom of Safari).</li>":"<li>Tap the <b>Share</b> button at the bottom of Safari.</li>")+"<li>Scroll and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li>"
      :"<li>Open your browser menu (⋮).</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b>.</li>"}</ol>${isIOS()&&navigator.share?'<button id="shr">Open share menu</button><div class="sp"></div>':""}`}<button id="sx" class="alt">Got it</button></div>`;
    document.body.appendChild(s);s.onclick=e=>{if(e.target===s||e.target.id==="sx")s.remove()};const sh=s.querySelector("#shr");if(sh)sh.onclick=()=>navigator.share({title:"Pifometer",url:location.href.split("?")[0]}).catch(()=>{})});
}
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
function confetti(n){const c=document.createElement("div");c.className="confetti";const cols=["#FF6B3D","#7B5CFF","#0FB67F","#FFC83D"];
  for(let i=0;i<n;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.background=cols[i%4];s.style.animationDelay=Math.random()*.4+"s";c.appendChild(s)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2200)}
function track(ev){/* plug analytics here (Plausible / PostHog) */}
home();
</script>
</body>
</html>
